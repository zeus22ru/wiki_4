<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f6">
    <title>БочкарИИ — Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=15">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/markdown.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/telegram-app.css') }}?v=1">
</head>
<body data-bot-username="{{ telegram_bot_username|e }}">
    <main class="tg-app" id="tgApp">
        <header class="tg-header">
            <div>
                <div class="tg-brand">БОЧКАР<span>ИИ</span></div>
                <div class="tg-status" id="serviceStatus">Подключение…</div>
            </div>
            <button class="tg-icon-button" id="historyButton" type="button" aria-label="История диалогов" disabled>☰</button>
        </header>

        <section class="tg-boot" id="bootState" aria-live="polite">
            <div class="tg-loader" aria-hidden="true"></div>
            <h1>Открываем БочкарИИ</h1>
            <p>Проверяем вход через Telegram.</p>
        </section>

        <section class="tg-error" id="errorState" hidden>
            <div class="tg-error__icon" aria-hidden="true">!</div>
            <h1 id="errorTitle">Не удалось открыть приложение</h1>
            <p id="errorText">Попробуйте открыть Mini App ещё раз.</p>
            <button class="tg-primary-button" id="retryButton" type="button">Повторить</button>
            <a class="tg-secondary-link" id="openBotLink" href="#" hidden>Открыть бота</a>
        </section>

        <section class="tg-chat" id="chatState" hidden>
            <div class="tg-messages" id="messages" aria-live="polite">
                <div class="tg-welcome" id="welcomeState">
                    <span class="tg-welcome__badge">База знаний</span>
                    <h1>Чем помочь?</h1>
                    <p>Найду ответ в корпоративных документах и покажу источники.</p>
                    <div class="tg-prompts">
                        <button type="button" data-prompt="Как настроить принтер на ТСД?">Настроить принтер на ТСД</button>
                        <button type="button" data-prompt="Покажи пошаговую инструкцию по типовой проблеме">Получить инструкцию</button>
                        <button type="button" id="continueChatButton">Продолжить диалог</button>
                    </div>
                </div>
            </div>

            <form class="tg-composer" id="messageForm">
                <textarea id="messageInput" rows="1" maxlength="1000" placeholder="Спросите по базе знаний…" aria-label="Сообщение"></textarea>
                <button id="sendButton" type="submit" aria-label="Отправить">➤</button>
            </form>
        </section>
    </main>

    <div class="tg-sheet" id="historySheet" hidden>
        <button class="tg-sheet__backdrop" type="button" data-close-sheet aria-label="Закрыть"></button>
        <section class="tg-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
            <div class="tg-sheet__header"><h2 id="historyTitle">Диалоги</h2><button type="button" data-close-sheet>×</button></div>
            <button class="tg-new-chat" id="newChatButton" type="button">＋ Новый диалог</button>
            <div class="tg-chat-list" id="chatList"></div>
        </section>
    </div>

    <div class="tg-sheet" id="sourcesSheet" hidden>
        <button class="tg-sheet__backdrop" type="button" data-close-sheet aria-label="Закрыть"></button>
        <section class="tg-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sourcesTitle">
            <div class="tg-sheet__header"><h2 id="sourcesTitle">Источники</h2><button type="button" data-close-sheet>×</button></div>
            <div class="tg-source-list" id="sourceList"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="{{ url_for('static', filename='telegram-app.js') }}?v=1"></script>
</body>
</html>
